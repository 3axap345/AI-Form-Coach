[project]
name = "ai-form-coach"
version = "0.1.0"
description = "Live squat-form collection and feedback prototype"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["collector/venv", "UI-PRMD", "collector/RehabExerAssess-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["collector"]

[tool.coverage.report]
omit = ["collector/tests/*"]
show_missing = true
fail_under = 63

[tool.mypy]
python_version = "3.11"
files = [
    "collector/canonical.py",
    "collector/config.py",
    "collector/landmarks.py",
    "collector/repetition.py",
    "collector/quality.py",
    "collector/preprocessing.py",
    "collector/form_model.py",
    "collector/form_inference.py",
    "collector/form_analysis.py",
    "collector/live_flow.py",
]
ignore_missing_imports = true
warn_unused_configs = true
